[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dl-op-to-hls"
version = "0.1.0"
description = "DL-Operator-to-HLS-Agent prototype for hls4ml and Vivado HLS workflows."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OpenAI Codex" }]
dependencies = []

[project.optional-dependencies]
real-toolchain = [
  "hls4ml",
  "onnx",
  "qonnx",
]
model-generation = [
  "torch",
  "onnx",
]

[project.scripts]
dl-op-to-hls = "dl_op_to_hls.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
