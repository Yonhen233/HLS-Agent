{
  "name": "unsupported_boundary_flow",
  "version": "1.1.0",
  "status": "approved",
  "description": "Handle partially supported or unsupported hls4ml/model boundary cases with actionable reporting.",
  "intent": "unsupported_boundary_handling",
  "purpose": "对无法安全证明语义、缺少 golden oracle 或超出当前能力边界的任务做诚实拒绝。",
  "procedure": [
    "确认 support check、模型边界或算子语义分析已经完成。",
    "记录具体 unsupported reason、缺失输入和无法验证的原因。",
    "如果存在可证明的静态 rewrite，单独提出 rewrite 任务。",
    "否则生成 actionable unsupported report，不生成未经验证的 HLS。",
    "保留证据、Trace 和失败经验，供后续扩展能力。"
  ],
  "decision_rules": [
    "没有独立 golden oracle 时禁止进入 candidate generation 和 Vivado synthesis。",
    "只要任务语义无法保持，就不能用相似算子强行替代。",
    "边界拒绝是 terminal decision，不应通过无限 repair 绕过。"
  ],
  "pitfalls": [
    "不要把 unsupported 伪装成 synthesis skipped。",
    "不要为满足成功率而生成无法验证的代码。",
    "不要只返回笼统的“不支持”，必须说明下一步行动。"
  ],
  "verification_guidance": [
    "unsupported report 必须包含 reason、evidence 和 suggested actions。",
    "确认没有产生 candidate HLS 或 Vivado synthesis artifact。",
    "确认该边界事实可以被 MemorySpecialist 作为 failure memory 引用。"
  ],
  "examples": [{"scenario": "unknown operator without reference", "expected_outcome": "actionable unsupported report and no unsafe synthesis"}],
  "trigger": {
    "task_type": ["model", "operator"],
    "conditions": ["hls4ml_unsupported_or_not_recommended"]
  },
  "preconditions": [
    "support_check_completed"
  ],
  "recommended_todos": [
    {
      "title": "Validate task schema",
      "assigned_tool": "task.validate_schema",
      "assigned_specialist": null
    },
    {
      "title": "Try graph rewrite",
      "assigned_tool": "graph_rewrite.rewrite",
      "assigned_specialist": null
    },
    {
      "title": "Generate unsupported report",
      "assigned_tool": "report.write_unsupported",
      "assigned_specialist": null
    },
    {
      "title": "Write run summary",
      "assigned_tool": "summary.write_summary",
      "assigned_specialist": null
    }
  ],
  "allowed_tools": [
    "workspace.scan",
    "workspace.search",
    "workspace.read_batch",
    "workspace.symbol_search",
    "task.validate_schema",
    "graph_rewrite.rewrite",
    "report.write_unsupported",
    "summary.write_summary",
    "memory.promote_to_long_term"
  ],
  "allowed_specialists": [
    "MemorySpecialist"
  ],
  "required_artifacts": [
    "unsupported_report",
    "summary",
    "trace",
    "state"
  ],
  "failure_policy": {
    "UnsupportedOperatorError": {
      "recommended_action": "write_actionable_report"
    }
  },
  "verification_policy": {
    "generated_code_requires_verification": true
  },
  "memory_policy": {
    "promote_failures": true
  },
  "tags": ["unsupported", "boundary"]
}
