{
  "name": "operator_fallback_flow",
  "description": "Generate fallback HLS implementation for supported operators, then run Vivado synthesis and reporting.",
  "intent": "operator_to_hls_fallback",
  "trigger": {
    "task_type": "operator",
    "op_types": ["Dense", "MatMul", "ReLU", "Add"]
  },
  "preconditions": [
    "task_schema_valid",
    "op_type_supported_by_fallback_template"
  ],
  "recommended_todos": [
    {
      "title": "Validate task schema",
      "assigned_tool": "task.validate_schema",
      "assigned_specialist": null
    },
    {
      "title": "Generate fallback HLS template",
      "assigned_tool": "fallback.generate_operator_hls",
      "assigned_specialist": null
    },
    {
      "title": "Run Vivado HLS synthesis",
      "assigned_tool": "vivado.run_csynth",
      "assigned_specialist": "VivadoSpecialist"
    },
    {
      "title": "Parse synthesis report",
      "assigned_tool": "vivado.parse_report",
      "assigned_specialist": "VivadoSpecialist"
    },
    {
      "title": "Generate optimization suggestions",
      "assigned_tool": "suggestion.suggest_optimization",
      "assigned_specialist": "OptimizationSpecialist"
    },
    {
      "title": "Promote memories",
      "assigned_tool": "memory.promote_to_long_term",
      "assigned_specialist": "MemorySpecialist"
    }
  ],
  "allowed_tools": [
    "task.validate_schema",
    "fallback.generate_operator_hls",
    "fallback.generate_testbench",
    "vivado.create_project",
    "vivado.run_csynth",
    "vivado.parse_report",
    "vivado.parse_log",
    "suggestion.suggest_optimization",
    "memory.promote_to_long_term"
  ],
  "allowed_specialists": [
    "VivadoSpecialist",
    "OptimizationSpecialist",
    "MemorySpecialist"
  ],
  "required_artifacts": [
    "hls_cpp",
    "hls_header",
    "testbench",
    "tcl",
    "summary",
    "trace",
    "state",
    "manifest"
  ],
  "failure_policy": {
    "VivadoNotFoundError": {
      "recommended_action": "mark_partial_success",
      "continue_with": ["vivado.parse_log", "summary.write_summary", "memory.promote_to_long_term"]
    },
    "VivadoSynthesisError": {
      "recommended_action": "parse_log_then_reflect",
      "continue_with": ["vivado.parse_log", "summary.write_summary"]
    }
  },
  "verification_policy": {
    "generated_code_requires_verification": true,
    "candidate_code_cannot_be_verified_by_llm": true
  },
  "memory_policy": {
    "promote_failures": true,
    "promote_metrics": true,
    "promote_verified_implementations": true
  },
  "tags": ["operator", "fallback", "vivado"]
}
